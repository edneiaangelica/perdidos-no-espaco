<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs><radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#1a0a0a"/><stop offset="100%" stop-color="#090b1a"/></radialGradient></defs>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="25" cy="12" r="1.5" fill="white" opacity="0.8"/><circle cx="160" cy="20" r="1.5" fill="white" opacity="0.7"/><circle cx="265" cy="18" r="1.5" fill="white" opacity="0.8"/>
<!-- fuel tank body --><rect x="130" y="80" width="140" height="170" rx="20" fill="#141936" stroke="#ff6f91" stroke-width="2.5"/>
<!-- tank cap --><rect x="170" y="65" width="60" height="20" rx="5" fill="#202750" stroke="#ff6f91" stroke-width="1.5"/>
<!-- mostly empty tank --><rect x="140" y="210" width="120" height="30" rx="8" fill="#ff6f91" opacity="0.5"/>
<!-- empty area --><rect x="140" y="90" width="120" height="120" rx="8" fill="#0a0e20"/>
<!-- level line --><line x1="140" y1="210" x2="260" y2="210" stroke="#ff6f91" stroke-width="1.5" stroke-dasharray="5,3"/>
<!-- gauge marks --><line x1="130" y1="110" x2="145" y2="110" stroke="#5de2ff" stroke-width="1.5"/>
<text x="120" y="114" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#5de2ff">100%</text>
<line x1="130" y1="235" x2="145" y2="235" stroke="#5de2ff" stroke-width="1.5"/>
<text x="120" y="239" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#5de2ff">0%</text>
<!-- sad emoji in empty area --><text x="200" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#ff6f91" opacity="0.7">QUASE VAZIO</text>
<text x="200" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff6f91">COMBUSTÍVEL INSUFICIENTE</text>
</svg>
