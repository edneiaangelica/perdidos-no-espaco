<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs><radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#3a2a00"/><stop offset="100%" stop-color="#090b1a"/></radialGradient></defs>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="25" cy="12" r="1.5" fill="white" opacity="0.8"/><circle cx="160" cy="20" r="1.5" fill="white" opacity="0.7"/><circle cx="265" cy="18" r="1.5" fill="white" opacity="0.8"/><circle cx="8" cy="195" r="1" fill="white" opacity="0.5"/>
<!-- clock face --><circle cx="200" cy="138" r="75" fill="#2a1a00" stroke="#ffcc00" stroke-width="3"/>
<!-- clock marks --><line x1="200" y1="68" x2="200" y2="80" stroke="#ffcc00" stroke-width="3"/>
<line x1="200" y1="196" x2="200" y2="208" stroke="#ffcc00" stroke-width="3"/>
<line x1="128" y1="138" x2="140" y2="138" stroke="#ffcc00" stroke-width="3"/>
<line x1="260" y1="138" x2="272" y2="138" stroke="#ffcc00" stroke-width="3"/>
<!-- clock hands (pointing to 12 = time up) --><line x1="200" y1="138" x2="200" y2="82" stroke="#ff6f91" stroke-width="4" stroke-linecap="round"/>
<line x1="200" y1="138" x2="200" y2="98" stroke="white" stroke-width="3" stroke-linecap="round"/>
<circle cx="200" cy="138" r="5" fill="#ffcc00"/>
<!-- urgent marks --><line x1="145" y1="55" x2="155" y2="70" stroke="#ff6f91" stroke-width="2"/><line x1="255" y1="55" x2="245" y2="70" stroke="#ff6f91" stroke-width="2"/>
<text x="200" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffcc00">TEMPO ESGOTADO!</text>
<text x="200" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="white" opacity="0.7">O tempo acabou!</text>
</svg>
