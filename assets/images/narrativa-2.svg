<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#2a1060"/><stop offset="100%" stop-color="#090b1a"/></radialGradient>
<radialGradient id="vortex" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8b00ff" stop-opacity="0.8"/><stop offset="100%" stop-color="#2a1060" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="25" cy="12" r="1.5" fill="white" opacity="0.8"/><circle cx="70" cy="25" r="1" fill="white" opacity="0.5"/><circle cx="160" cy="20" r="1.5" fill="white" opacity="0.7"/><circle cx="320" cy="12" r="1" fill="white" opacity="0.6"/><circle cx="8" cy="195" r="1" fill="white" opacity="0.5"/>
