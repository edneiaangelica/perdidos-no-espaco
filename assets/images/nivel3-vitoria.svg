<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs><radialGradient id="bg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#0a2a1a"/><stop offset="100%" stop-color="#090b1a"/></radialGradient></defs>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="25" cy="12" r="1.5" fill="white" opacity="0.8"/><circle cx="160" cy="20" r="1.5" fill="white" opacity="0.7"/><circle cx="265" cy="18" r="1.5" fill="white" opacity="0.8"/><circle cx="375" cy="25" r="2" fill="white" opacity="0.5"/>
<!-- fuel tank body --><rect x="130" y="80" width="140" height="170" rx="20" fill="#141936" stroke="#3ad47c" stroke-width="2.5"/>
<!-- tank cap --><rect x="170" y="65" width="60" height="20" rx="5" fill="#202750" stroke="#3ad47c" stroke-width="1.5"/>
<!-- fuel level 100% FULL --><rect x="140" y="90" width="120" height="150" rx="15" fill="#3ad47c" opacity="0.8"/>
<!-- shine on fuel --><rect x="148" y="95" width="15" height="140" rx="7" fill="white" opacity="0.15"/>
<!-- gauge marks --><line x1="130" y1="110" x2="145" y2="110" stroke="white" stroke-width="1.5"/><text x="120" y="114" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="white" opacity="0.8">100%</text>
<!-- 100% label --><text x="200" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="white">100%</text>
<!-- celebration --><circle cx="80" cy="70" r="5" fill="#ffcc00"/><circle cx="320" cy="65" r="5" fill="#ffcc00"/>
<text x="200" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#3ad47c">TANQUE CHEIO!</text>
</svg>
