<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#3a0a3a"/><stop offset="100%" stop-color="#090b1a"/></radialGradient>
<radialGradient id="neb" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#9b30c0" stop-opacity="0.5"/><stop offset="50%" stop-color="#e84ca0" stop-opacity="0.3"/><stop offset="100%" stop-color="#3a0a3a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="400" height="300" fill="url(#bg)"/>
<circle cx="25" cy="12" r="1.5" fill="white" opacity="0.8"/><circle cx="160" cy="20" r="1.5" fill="white" opacity="0.7"/><circle cx="265" cy="18" r="1.5" fill="white" opacity="0.8"/><circle cx="375" cy="25" r="2" fill="white" opacity="0.5"/><circle cx="390" cy="60" r="1.5" fill="white" opacity="0.7"/><circle cx="8" cy="195" r="1" fill="white" opacity="0.5"/><circle cx="360" cy="258" r="2" fill="white" opacity="0.6"/>
<!-- nebula cloud --><ellipse cx="200" cy="148" rx="180" ry="120" fill="url(#neb)"/>
<ellipse cx="120" cy="110" rx="80" ry="50" fill="#9b30c0" opacity="0.15"/>
<ellipse cx="280" cy="180" rx="70" ry="45" fill="#e84ca0" opacity="0.12"/>
<!-- damaged spaceship --><g transform="translate(200,140)">
<ellipse cx="0" cy="0" rx="35" ry="16" fill="#5de2ff" opacity="0.85"/>
<polygon points="0,-25 -15,-5 15,-5" fill="#3ab0cc"/>
<circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
<!-- damage marks --><line x1="-20" y1="-8" x2="-30" y2="-18" stroke="#ff6f91" stroke-width="2.5"/>
<line x1="15" y1="8" x2="25" y2="18" stroke="#ff6f91" stroke-width="2"/>
</g>
<text x="200" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e84ca0">PRESA NA NEBULOSA</text>
